name: Refuse pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --comment "This repository is a source publication and does not accept pull requests. Fork it instead."
